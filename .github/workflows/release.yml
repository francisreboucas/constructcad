name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p cc_app -p cc_cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="constructcad-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md README.pt-BR.md LICENSE CHANGELOG.md "dist/$name/"
          cp examples/casa_simples.ccad "dist/$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/constructcad.exe" "target/${{ matrix.target }}/release/ccad.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/constructcad" "target/${{ matrix.target }}/release/ccad" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - name: Build AppImage
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          curl -L -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage
          appdir=AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp "target/${{ matrix.target }}/release/constructcad" "$appdir/usr/bin/"
          cp "target/${{ matrix.target }}/release/ccad" "$appdir/usr/bin/"
          cp assets/icons/app-icon-256.png \
            "$appdir/usr/share/icons/hicolor/256x256/apps/constructcad.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=ConstructCAD' \
            'Comment=Free and open source Building Information Modeling (BIM) software.' \
            'Exec=constructcad %f' \
            'Icon=constructcad' \
            'Categories=Graphics;Engineering;' \
            'Keywords=BIM;CAD;architecture;engineering;' \
            'Terminal=false' \
            'StartupWMClass=ConstructCAD' \
            > "$appdir/constructcad.desktop"
          ./linuxdeploy.AppImage \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/constructcad" \
            --executable "$appdir/usr/bin/ccad" \
            --desktop-file "$appdir/constructcad.desktop" \
            --output appimage
          mv "ConstructCAD-${VERSION}-x86_64.AppImage" \
            "dist/constructcad-${GITHUB_REF_NAME}-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.AppImage

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ConstructCAD $GITHUB_REF_NAME" --notes-file notes.md
