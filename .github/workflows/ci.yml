name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ifc:
    name: IFC validation (IfcOpenShell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install IfcOpenShell (CI only, not a project dependency)
        run: pip install -r scripts/requirements-ifc.txt
      - name: Export sample projects
        run: |
          mkdir -p target/ifc
          cargo run --locked -p cc_ifc --example export_ifc -- examples/casa_simples.ccad target/ifc/casa_simples.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/features.ccad target/ifc/features.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/structure.ccad target/ifc/structure.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/mep.ccad target/ifc/mep.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/arcs.ccad target/ifc/arcs.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/roofs.ccad target/ifc/roofs.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/phases.ccad target/ifc/phases.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/curtains.ccad target/ifc/curtains.ifc
          cargo run --locked -p cc_ifc --example export_ifc -- crates/cc_ifc/tests/fixtures/classes.ifc target/ifc/classes.ifc
      - name: Validate
        run: |
          python scripts/validate_ifc.py target/ifc/casa_simples.ifc
          python scripts/validate_ifc.py target/ifc/features.ifc
          python scripts/validate_ifc.py target/ifc/structure.ifc
          python scripts/validate_ifc.py target/ifc/mep.ifc
          python scripts/validate_ifc.py target/ifc/arcs.ifc
          python scripts/validate_ifc.py target/ifc/roofs.ifc
          python scripts/validate_ifc.py target/ifc/phases.ifc
          python scripts/validate_ifc.py target/ifc/curtains.ifc
          python scripts/validate_ifc.py target/ifc/classes.ifc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ifc-exports
          path: target/ifc/*.ifc

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by lines
        run: |
          base=${{ github.event.pull_request.base.sha }}
          missing=0
          for sha in $(git rev-list --no-merges "$base..${{ github.event.pull_request.head.sha }}"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format=%B "$sha" | grep -qF "Signed-off-by: $author"; then
              echo "::error::Commit $(git show -s --format='%h "%s"' "$sha") needs the line 'Signed-off-by: $author'"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Every commit is signed off."
            exit 0
          fi
          {
            echo "## DCO sign-off missing"
            echo
            echo "$missing commit(s) lack a \`Signed-off-by\` line matching their author. Signing off certifies the"
            echo "[Developer Certificate of Origin](https://developercertificate.org/): that you wrote the change"
            echo "or have the right to submit it under the project's license."
            echo
            echo "To sign off the commits already in this pull request, run in your branch:"
            echo
            echo '```sh'
            echo "git fetch https://github.com/${{ github.repository }}.git ${{ github.event.pull_request.base.ref }}"
            echo "git rebase --signoff $base"
            echo "git push --force-with-lease"
            echo '```'
            echo
            echo "From then on, commit with \`git commit -s\`. The sign-off must use the same name and email as the"
            echo "commit author (\`git config user.name\` / \`user.email\`). See CONTRIBUTING.md for details."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
