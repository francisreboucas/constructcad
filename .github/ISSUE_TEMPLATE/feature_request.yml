name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should ConstructCraft behave? Describe it in your own words or with sketches.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: clean-room
    attributes:
      label: Clean-room policy
      options:
        - label: This request does not include material copied from proprietary software or its documentation beyond what is publicly available (see CONTRIBUTING.md).
          required: true
