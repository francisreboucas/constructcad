[workspace]
resolver = "3"
members = ["crates/cc_core", "crates/cc_geom", "crates/cc_views", "crates/cc_render", "crates/cc_ifc", "crates/cc_cad", "crates/cc_skp", "crates/cc_engine", "crates/cc_cli", "crates/cc_app"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Francis Rebouças <francisreboucas@gmail.com>"]
repository = "https://github.com/francisreboucas/constructcad"

[workspace.dependencies]
cc_core = { path = "crates/cc_core" }
cc_geom = { path = "crates/cc_geom" }
cc_views = { path = "crates/cc_views" }
cc_render = { path = "crates/cc_render" }
cc_ifc = { path = "crates/cc_ifc" }
cc_cad = { path = "crates/cc_cad" }
cc_skp = { path = "crates/cc_skp" }
cc_engine = { path = "crates/cc_engine" }

eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence", "accesskit", "links", "x11", "wayland"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_dock = "0.21.1"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
wgpu = "30.0.1"
glam = { version = "0.34.1", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12.2"
earcutr = "0.5.0"
rfd = "0.17.2"
png = "0.18.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror = "2"
serde_json = "1"
schemars = "1"
log = "0.4"
sys-locale = "0.3.2"
env_logger = "0.11"
# `raster-images`: pictures in exported PNGs (the decoders `image` brings anyway).
resvg = { version = "0.45.1", default-features = false, features = ["raster-images"] }
# Compressing the pixels of pictures in exported PDFs (cc_views).
miniz_oxide = "0.8.9"
# Decoding imported pictures (cc_views), the version eframe already uses.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Glyph outlines for raster export (cc_views), the version egui already uses.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# DWG reading (cc_cad), MPL-2.0, pure Rust; without `parallel` (no rayon).
acadrust = { version = "0.6.8", default-features = false }
# Code-page text of pre-2007 DXF files (cc_cad), already used by acadrust.
encoding_rs = "0.8"
# Update notice (cc_app): HTTPS with rustls, no other TLS stack.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
# SHA-256 of downloaded updates (cc_app), checked against the release's SHA256SUMS.txt.
sha2 = "0.10.9"

# Robustness rules (see AGENTS.md): no unsafe, and no panics outside tests.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
